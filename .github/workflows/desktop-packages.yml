name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  linux-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libfuse2t64 xvfb poppler-utils
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - run: test -s release/SideMaster-1.0.3-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: sidemaster-linux-x64
          path: release/SideMaster-1.0.3-x86_64.AppImage
      - shell: bash
        run: |
          chmod +x release/SideMaster-1.0.3-x86_64.AppImage
          mkdir -p "$RUNNER_TEMP/sidemaster-appimage"
          (cd "$RUNNER_TEMP/sidemaster-appimage" && "$GITHUB_WORKSPACE/release/SideMaster-1.0.3-x86_64.AppImage" --appimage-extract >/dev/null)
          export XDG_CONFIG_HOME="$RUNNER_TEMP/sidemaster-profile"
          export SIDEMASTER_PROFILE_DIR="$XDG_CONFIG_HOME/SideMaster"
          export SIDEMASTER_APP_EXE="$RUNNER_TEMP/sidemaster-appimage/squashfs-root/AppRun"
          export SIDEMASTER_TEST_OUTPUT_DIR="$SIDEMASTER_PROFILE_DIR/smoke-exports"
          mkdir -p "$XDG_CONFIG_HOME"
          timeout 120s xvfb-run -a bash -c '
            set -e
            "$SIDEMASTER_APP_EXE" --no-sandbox --remote-debugging-port=9222 --inspect=9223 >/tmp/sidemaster-electron.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            node "$GITHUB_WORKSPACE/scripts/electron-smoke.mjs" edit-close
            if wait "$app_pid"; then :; else
              app_exit=$?
              cat /tmp/sidemaster-electron.log
              exit "$app_exit"
            fi
            trap - EXIT
          '
          pdfinfo "$SIDEMASTER_TEST_OUTPUT_DIR/export-4.pdf" | grep -F 'Page size:       594.96 x 841.92 pts (A4)'

  windows-packages:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - shell: pwsh
        run: |
          npm version 1.0.0 --no-git-tag-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare baseline version' }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
          $installer = Get-ChildItem release/SideMaster-1.0.0-Setup.exe
          if (-not $installer -or $installer.Length -eq 0) { throw 'NSIS installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'SideMaster-install'
          Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait
          $app = Join-Path $installDir 'SideMaster.exe'
          if (-not (Test-Path $app)) { throw 'Installed app missing' }
          $env:SIDEMASTER_APP_EXE = $app
          $env:SIDEMASTER_PROFILE_DIR = Join-Path $env:APPDATA 'SideMaster'
          $process = Start-Process -FilePath $app -ArgumentList @('--remote-debugging-port=9222', '--inspect=9223') -PassThru
          node scripts/electron-smoke.mjs edit-close
          if ($LASTEXITCODE -ne 0) { throw 'Baseline smoke test failed' }
          if (-not $process.WaitForExit(30000)) { throw 'Baseline app did not exit' }
          npm version 1.0.3 --no-git-tag-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare release version' }
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $upgrade = Get-ChildItem release/SideMaster-1.0.3-Setup.exe
          if (-not $upgrade -or $upgrade.Length -eq 0) { throw 'Updated NSIS installer missing' }
          Start-Process -FilePath $upgrade.FullName -ArgumentList @('/S', "/D=$installDir") -Wait
          $updatedApp = Join-Path $installDir 'SideMaster.exe'
          $updated = Start-Process -FilePath $updatedApp -ArgumentList @('--remote-debugging-port=9222', '--inspect=9223') -PassThru
          node scripts/electron-smoke.mjs verify-update
          if ($LASTEXITCODE -ne 0) { throw 'Installed update smoke test failed' }
          if (-not $updated.WaitForExit(30000)) { throw 'Updated app did not exit' }
          $portableApp = Join-Path $env:GITHUB_WORKSPACE 'release/SideMaster-1.0.3-Portable.exe'
          if (-not (Test-Path $portableApp)) { throw 'Updated portable executable missing' }
          $env:SIDEMASTER_APP_EXE = $portableApp
          $portableProcess = Start-Process -FilePath $portableApp -ArgumentList @('--remote-debugging-port=9222', '--inspect=9223') -PassThru
          node scripts/electron-smoke.mjs verify-update
          if ($LASTEXITCODE -ne 0) { throw 'Portable update smoke test failed' }
          if (-not $portableProcess.WaitForExit(30000)) { throw 'Portable app did not exit' }
      - uses: actions/upload-artifact@v4
        with:
          name: sidemaster-windows-x64
          path: release/SideMaster-1.0.3-Portable.exe

  publish-release:
    if: github.ref == 'refs/tags/v1.0.3'
    needs: [linux-appimage, windows-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: sidemaster-*
          merge-multiple: true
      - name: Check release assets
        run: |
          test -s release-assets/SideMaster-1.0.3-x86_64.AppImage
          test -s release-assets/SideMaster-1.0.3-Portable.exe
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "SideMaster ${GITHUB_REF_NAME#v}" --generate-notes
